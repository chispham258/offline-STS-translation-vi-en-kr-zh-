# CPU/edge arm: whisper-base + hybrid TTS router, Vietnamese = Piper.
#
# Owner decision 2026-10-21: on CPU, use Piper vi. VieNeu v3 Turbo is kept in
# full_en_vi_vieneu_async_hybrid.yaml as the quality/NPU arm: it synthesised
# 7.36 s of audio in 10.56 s on this Mac CPU (pipeline RTF 1.116), so it cannot
# meet < 0.6 here. Piper vi synthesised the same utterance in 0.44 s
# (pipeline RTF 0.252).
#
# en/zh/ko use Piper voices; the router selects by languages.tgt, so only the
# target backend is imported at runtime.

experiment:
  name: full_en_vi_cpu_hybrid_async
  classification: development
  notes: CPU/edge arm - whisper base, envit5, Piper vi/en/zh/ko via language router

languages:
  src: en
  tgt: vi

pipeline:
  enabled: true
  queue_sizes:
    vad_asr: 128
    asr_mt: 64
    mt_tts: 64

vad:
  model: silero

asr:
  model: faster_whisper
  params:
    model_name: base
    device: cpu
    compute_type: int8
    beam_size: 1
    num_workers: 4

mt:
  model: envit5
  params:
    model_name: VietAI/envit5-translation

tts:
  model: language_router
  params:
    backends:
      vi:
        module: onevoice.components.piper_tts
        model: piper
        params:
          voice: vi_VN-vais1000-medium
      en:
        module: onevoice.components.piper_tts
        model: piper
        params:
          voice: en_US-lessac-medium
      zh:
        module: onevoice.components.piper_tts
        model: piper
        params:
          voice: zh_CN-huayan-medium
      ko:
        module: onevoice.components.piper_tts
        model: piper
        params:
          voice: ko_KR-kss-medium
