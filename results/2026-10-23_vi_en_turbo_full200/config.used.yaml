experiment:
  name: full_vi_en_hybrid_async
  classification: development
  notes: vi->en CPU arm after ASR/MT bake-off - whisper-large-v3-turbo CT2 INT8 +
    envit5; previous 200-run baseline was whisper-base + m2m100
languages:
  src: vi
  tgt: en
vad:
  model: silero
  params:
    threshold: 0.5
    min_silence_duration_ms: 700
    speech_pad_ms: 30
asr:
  model: faster_whisper
  params:
    model_name: models/whisper-large-v3-turbo-ct2-int8
    device: cpu
    compute_type: int8
    beam_size: 1
    num_workers: 4
mt:
  model: envit5
  params:
    model_name: VietAI/envit5-translation
tts:
  model: language_router
  params:
    backends:
      vi:
        module: onevoice.components.piper_tts
        model: piper
        params:
          voice: vi_VN-vais1000-medium
      en:
        module: onevoice.components.piper_tts
        model: piper
        params:
          voice: en_US-lessac-medium
      zh:
        module: onevoice.components.piper_tts
        model: piper
        params:
          voice: zh_CN-huayan-medium
      ko:
        module: onevoice.components.piper_tts
        model: piper
        params:
          voice: ko_KR-kss-medium
pipeline:
  enabled: true
  queue_sizes:
    vad_asr: 128
    asr_mt: 64
    mt_tts: 64
