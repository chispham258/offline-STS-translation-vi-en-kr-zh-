# Quality/NPU TTS arm: whisper-base + hybrid TTS with VieNeu Vietnamese.
#
# TTS is one `language_router` config covering all four target languages:
#   vi -> VieNeu v3 Turbo (D79, owner-selected)
#   en/zh/ko -> Piper ONNX voices
# `languages.tgt` selects the backend at construction time. The en->vi run
# below builds VieNeu only; a vi->en run would build Piper en, and so on.
#
# VieNeu Turbo is too slow on this Mac CPU: 10.56 s of synthesis for 7.36 s
# of audio, pipeline RTF 1.116. The CPU/edge arm is
# full_en_vi_cpu_hybrid_async.yaml (Piper vi). This config remains for the
# NPU/quality arm and for reproducing the Turbo measurement.
#
# ASR is whisper-base here because turbo is 13-15 s per 5 s window on this
# Mac CPU.

experiment:
  name: full_en_vi_vieneu_hybrid_async
  classification: development
  notes: Quality/NPU arm - Whisper base, VieNeu vi + Piper en/zh/ko; CPU RTF 1.116

languages:
  src: en
  tgt: vi

pipeline:
  enabled: true
  queue_sizes:
    vad_asr: 128
    asr_mt: 64
    mt_tts: 64

vad:
  model: silero

asr:
  model: faster_whisper
  params:
    model_name: base
    device: cpu
    compute_type: int8
    beam_size: 1
    num_workers: 4

mt:
  model: envit5
  params:
    model_name: VietAI/envit5-translation

tts:
  model: language_router
  params:
    backends:
      vi:
        module: onevoice.components.vieneu_tts
        model: vieneu
        params:
          voice: Mai Anh
          precision: int8
      en:
        module: onevoice.components.piper_tts
        model: piper
        params:
          voice: en_US-lessac-medium
      zh:
        module: onevoice.components.piper_tts
        model: piper
        params:
          voice: zh_CN-huayan-medium
      ko:
        module: onevoice.components.piper_tts
        model: piper
        params:
          voice: ko_KR-kss-medium
