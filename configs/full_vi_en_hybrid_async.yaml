# vi -> en on the same async pipeline: streaming ASR + envit5 + Piper English.
#
# This is the end-to-end check for the language router: the target language in
# `languages.tgt` selects the English Piper backend. The en->vi arm uses the
# same router with target vi, which selects VieNeu.

experiment:
  name: full_vi_en_hybrid_async
  classification: development
  notes: >-
    vi->en CPU arm after ASR/MT bake-off - wav2vec2-base-vietnamese-250h with
    its Vietnamese 4-gram LM + envit5. Whisper-large-v3-turbo remains the
    quality reference and fallback; it fails the pipeline RTF target.

languages:
  src: vi
  tgt: en

pipeline:
  enabled: true
  queue_sizes:
    vad_asr: 128
    asr_mt: 64
    mt_tts: 64

# Silero endpointing for Vietnamese: 700 ms bridges short pauses without the
# 1 s turn-taking delay of 1000 ms. Multi-segment utterances are handled by
# the driver, so this value is not asked to bridge the 1.1 s pause in utt 1660.
vad:
  model: silero
  params:
    threshold: 0.5
    min_silence_duration_ms: 700
    speech_pad_ms: 30

asr:
  model: wav2vec2
  params:
    model_name: nguyenvulebinh/wav2vec2-base-vietnamese-250h
    # 1.36 GB KenLM; models/ is gitignored. CC-BY-NC-4.0, non-commercial MVP.
    lm_path: models/wav2vec2-vi-lm/vi_lm_4grams.bin
    beam_width: 100
    alpha: 0.5
    beta: 1.5

mt:
  model: envit5
  params:
    model_name: VietAI/envit5-translation

tts:
  model: language_router
  params:
    backends:
      vi:
        module: onevoice.components.piper_tts
        model: piper
        params:
          voice: vi_VN-vais1000-medium
      en:
        module: onevoice.components.piper_tts
        model: piper
        params:
          voice: en_US-lessac-medium
      zh:
        module: onevoice.components.piper_tts
        model: piper
        params:
          voice: zh_CN-huayan-medium
      ko:
        module: onevoice.components.piper_tts
        model: piper
        params:
          voice: ko_KR-kss-medium
