# Async pipeline with Piper TTS (Option 1)
experiment:
  name: full_200_async_piper
  classification: development
languages:
  src: en
  tgt: vi
pipeline:
  enabled: true
  queue_sizes:
    vad_asr: 128
    asr_mt: 64
    mt_tts: 64
vad:
  model: silero
asr:
  model: faster_whisper
  params:
    model_name: models/whisper-large-v3-turbo-ct2-int8
    device: cpu
    compute_type: int8
    beam_size: 1
    num_workers: 4
mt:
  model: envit5
  params:
    model_name: VietAI/envit5-translation
tts:
  model: piper
  params:
    voice: vi_VN-vais1000-medium